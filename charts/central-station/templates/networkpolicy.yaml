{{- if .Values.networkPolicy.enabled }}
# Who may connect to each pod. With auth.mode=proxy this is half of what makes
# the Tailscale-User-Login header a sign-in: the api serves a request as
# whoever the header names, so only pods that cannot be made to send a forged
# one may reach the two listeners on the way to it.
#
#   web :3000       the Tailscale operator's proxy for this release's Ingress,
#                   in the operator's namespace. The proxy sets the header from
#                   the tailnet identity and replaces any copy the client sent.
#                   Selected by the labels the operator puts on each proxy,
#                   naming its parent Ingress.
#   api :8080       the web pod (nginx forwards /api/ to it), and the player
#                   pod when enabled: it runs this chart's own image and
#                   authenticates with a zone token, never with identity.
#   tts :5000       the api.
#   postgres :5432  the api. kubectl exec and port-forward enter the pod's
#                   own network namespace, so psql from an admin still works.
#
# No other pod, including the rest of the namespace. The node the pods run on
# is the one caller no NetworkPolicy can refuse: kube-router (k3s's policy
# controller) accepts node-local traffic ahead of every policy, which is why
# the kubelet's probes need no rule here and why hostNetwork pods and host
# processes get through. auth.trustedProxyCIDRs, the other half, makes the
# api (and nginx in the web pod) refuse their headers.
#
# Passing probes do not show the policy is enforced: a disabled controller
# passes everything too. Check refusals (the chart README).
#
# Ingress only; egress stays open for Google, media providers and DNS.
{{- $proxyNS := .Values.networkPolicy.proxyNamespace }}
{{- range $component, $port := dict "web" 3000 "api" 8080 "tts" 5000 "postgres" 5432 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "central.name" $ }}-{{ $component }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "central.name" $ }}-{{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if eq $component "web" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $proxyNS | quote }}
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
              tailscale.com/parent-resource-type: ingress
              tailscale.com/parent-resource-ns: {{ $.Release.Namespace | quote }}
              tailscale.com/parent-resource: {{ include "central.name" $ | quote }}
        {{- else }}
        - podSelector:
            matchLabels:
              app: {{ include "central.name" $ }}-{{ if eq $component "api" }}web{{ else }}api{{ end }}
        {{- if and (eq $component "api") $.Values.player.enabled }}
        - podSelector:
            matchLabels:
              app: {{ include "central.name" $ }}-player
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
