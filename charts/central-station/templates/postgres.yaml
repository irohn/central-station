apiVersion: v1
kind: Service
metadata:
  name: {{ include "central.name" . }}-postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: {{ include "central.name" . }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "central.name" . }}-postgres
spec:
  serviceName: {{ include "central.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "central.name" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "central.name" . }}-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: central}
            - {name: POSTGRES_DB, value: central}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            exec:
              command: [pg_isready, -U, central, -d, central]
          startupProbe:
            exec:
              command: [pg_isready, -U, central, -d, central]
            failureThreshold: 60
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
