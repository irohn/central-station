apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central.name" . }}-config
data:
  APP_ENV: production
  ADDR: ":8080"
  BASE_URL: {{ required "publicURL is required" .Values.publicURL | quote }}
  FRONTEND_URL: {{ .Values.publicURL | quote }}
  GOOGLE_REDIRECT_URL: {{ printf "%s/api/v1/auth/google/callback" .Values.publicURL | quote }}
  AUTH_DEV_MODE: "false"
  AUTH_PASSWORD_ENABLED: "false"
  COOKIE_SECURE: "true"
  ACCESS_ALLOWLIST: {{ .Values.auth.accessAllowlist | quote }}
  ADMIN_EMAILS: {{ join "," .Values.auth.adminEmails | quote }}
  ALLOWED_EMAILS: {{ join "," .Values.auth.allowedEmails | quote }}
  ALLOWED_EMAIL_DOMAINS: {{ join "," .Values.auth.allowedDomains | quote }}
  TTS_URL: "http://{{ include "central.name" . }}-tts:5000"
  ALERTS_TIMEZONE: Asia/Jerusalem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central.name" . }}-nginx
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
    
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
    
        # Same-origin API: cookies, CORS and WebSockets all just work.
        location /api/ {
            proxy_pass http://{{ include "central.name" . }}-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        location = /healthz { proxy_pass http://{{ include "central.name" . }}-api:8080/healthz; }
        location = /readyz  { proxy_pass http://{{ include "central.name" . }}-api:8080/readyz; }
    
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
