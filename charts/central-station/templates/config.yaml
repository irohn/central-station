apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central.name" . }}-config
data:
  APP_ENV: production
  ADDR: ":8080"
  BASE_URL: {{ required "publicURL is required" .Values.publicURL | quote }}
  FRONTEND_URL: {{ .Values.publicURL | quote }}
  {{- if include "central.proxyMode" . }}
  # Sign-in from the proxy's identity header. The CIDRs are the other half of
  # the NetworkPolicy: the api believes the header only from these peers, so
  # the node, which no policy keeps out, is refused as an untrusted peer.
  AUTH_MODE: proxy
  AUTH_TRUSTED_PROXY_CIDRS: {{ join "," .Values.auth.trustedProxyCIDRs | quote }}
  AUTH_TRUSTED_HEADER: {{ .Values.auth.trustedHeader | quote }}
  AUTH_DISPLAY_NAME_HEADER: {{ .Values.auth.displayNameHeader | default "none" | quote }}
  AUTH_PICTURE_HEADER: {{ .Values.auth.pictureHeader | default "none" | quote }}
  {{- else }}
  AUTH_MODE: google
  GOOGLE_REDIRECT_URL: {{ printf "%s/api/v1/auth/google/callback" .Values.publicURL | quote }}
  {{- end }}
  AUTH_DEV_MODE: "false"
  AUTH_PASSWORD_ENABLED: "false"
  COOKIE_SECURE: "true"
  ACCESS_ALLOWLIST: {{ .Values.auth.accessAllowlist | quote }}
  ADMIN_EMAILS: {{ join "," .Values.auth.adminEmails | quote }}
  ALLOWED_EMAILS: {{ join "," .Values.auth.allowedEmails | quote }}
  ALLOWED_EMAIL_DOMAINS: {{ join "," .Values.auth.allowedDomains | quote }}
  TTS_URL: "http://{{ include "central.name" . }}-tts:5000"
  ALERTS_TIMEZONE: Asia/Jerusalem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "central.name" . }}-nginx
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    {{- if include "central.proxyMode" . }}

    # Sign-in from the proxy's identity header: the api believes the header
    # from this pod, so this pod must only forward it for the Tailscale proxy.
    # The NetworkPolicy keeps other pods off :3000, but not the node the pod
    # runs on (kube-router admits node-local traffic ahead of every policy),
    # so /api/ is refused outright for any peer outside the trusted ranges:
    # the same list as AUTH_TRUSTED_PROXY_CIDRS, the pod range minus the
    # node's own addresses. The kubelet's probes only fetch /, which stays.
    geo $central_trusted_peer {
        default 0;
        {{- range .Values.auth.trustedProxyCIDRs }}
        {{ . }} 1;
        {{- end }}
    }
    {{- end }}
    
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
    
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
    
        # Same-origin API: cookies, CORS and WebSockets all just work.
        location /api/ {
            {{- if include "central.proxyMode" . }}
            default_type application/json;
            if ($central_trusted_peer = 0) {
                return 403 '{"error":{"code":"untrusted_peer","message":"identity headers are not accepted from this address; open Central Station through the tailnet"}}';
            }
            {{- end }}
            proxy_pass http://{{ include "central.name" . }}-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
        location = /healthz { proxy_pass http://{{ include "central.name" . }}-api:8080/healthz; }
        location = /readyz  { proxy_pass http://{{ include "central.name" . }}-api:8080/readyz; }
    
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
