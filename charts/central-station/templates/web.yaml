apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "central.name" . }}-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "central.name" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "central.name" . }}-web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/central-station-web:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
      volumes:
        - name: nginx
          configMap:
            name: {{ include "central.name" . }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "central.name" . }}-web
spec:
  type: ClusterIP
  selector:
    app: {{ include "central.name" . }}-web
  ports:
    - name: http
      port: 3000
      targetPort: http
