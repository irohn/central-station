apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "central.name" . }}-tts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "central.name" . }}-tts
  template:
    metadata:
      labels:
        app: {{ include "central.name" . }}-tts
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: tts
          image: "{{ .Values.image.registry }}/central-station-tts:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: http
              containerPort: 5000
          resources:
            {{- toYaml .Values.resources.tts | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "central.name" . }}-tts
spec:
  type: ClusterIP
  selector:
    app: {{ include "central.name" . }}-tts
  ports:
    - name: http
      port: 5000
      targetPort: http
