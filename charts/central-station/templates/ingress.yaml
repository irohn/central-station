{{- if .Values.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "central.name" . }}
  annotations:
    tailscale.com/tags: {{ .Values.tailscale.tags | quote }}
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "central.name" . }}-web
      port:
        number: 3000
  tls:
    - hosts:
        - {{ .Values.tailscale.hostname | quote }}
{{- end }}
