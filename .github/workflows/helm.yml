name: Helm
on:
  push:
    paths: ['charts/**', 'docs/helm/**', '.github/workflows/helm.yml']
  pull_request:
    paths: ['charts/**', 'docs/helm/**', '.github/workflows/helm.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.6
      - run: |
          helm lint charts/central-station
          # Proxy mode must refuse to render without its guards, and render with them.
          ! helm template central-station charts/central-station --set auth.mode=proxy >/dev/null 2>&1
          helm template central-station charts/central-station --set auth.mode=proxy \
            --set 'auth.trustedProxyCIDRs={10.42.0.2/31}' --set 'auth.allowedDomains={example.com}' >/dev/null
          helm template central-station charts/central-station > /tmp/rendered.yaml
          helm template central-station docs/helm/central-station-0.2.0.tgz > /tmp/packaged.yaml
          diff -u /tmp/rendered.yaml /tmp/packaged.yaml
